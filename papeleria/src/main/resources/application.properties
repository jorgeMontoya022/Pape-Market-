spring.application.name=papeleria

# ===================================================================
# CONEXIÓN A LA BASE DE DATOS POSTGRESQL
# Los valores se leen del archivo .env mediante spring-dotenv.
# Para desarrollo local: copia .env.example como .env y completa
# los valores. El archivo .env nunca se sube a git.
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/papeleria_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR DE CORREO (SMTP Gmail)
# Los valores se leen del archivo .env.
# Usar Contraseña de Aplicación de Google, no la contraseña principal.
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# CONFIGURACIÓN JWT
# Los valores se leen del archivo .env.
# JWT_SECRET: mínimo 64 caracteres hexadecimales (256 bits).
# Generar con: openssl rand -hex 32
# ===================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ===================================================================
# URL del frontend para el enlace de recuperación de contraseña
app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:4200/reset-password}

# ===================================================================
# SWAGGER / SPRINGDOC
# Deshabilitado por defecto (producción segura).
# Activar únicamente con el perfil dev.
# ===================================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===================================================================
# JACKSON (Serializador JSON)
# ===================================================================
spring.jackson.serialization.fail-on-empty-beans=false
