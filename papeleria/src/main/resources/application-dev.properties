# ===================================================================
# PERFIL DE DESARROLLO LOCAL (dev)
# Este archivo sobreescribe application.properties cuando arrancas con:
#   --spring.profiles.active=dev
#
# Cómo activarlo en IntelliJ IDEA:
#   1. Run > Edit Configurations...
#   2. En tu configuración de Spring Boot, busca "Active profiles"
#   3. Escribe: dev
#   4. Aplica y vuelve a ejecutar la app
#
# Cómo activarlo desde terminal (en la raíz del proyecto):
#   .\gradlew bootRun --args='--spring.profiles.active=dev'
# ===================================================================

# ===================================================================
# SWAGGER HABILITADO SOLO EN DESARROLLO
# Accede en: http://localhost:8080/swagger-ui/index.html
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.resolve-schema-properties=false
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operationsSorter=alpha

# ===================================================================
# LOGS MÁS DETALLADOS EN DESARROLLO
# ===================================================================
spring.jpa.show-sql=true
logging.level.com.papeleriafundadores=DEBUG
logging.level.org.springframework.security=DEBUG
